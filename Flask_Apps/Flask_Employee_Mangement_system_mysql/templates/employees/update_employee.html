{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 20px auto; border-top: 3px solid var(--primary-color);">
    <h2 style="margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
        <span class="highlight">Update</span> Personnel
    </h2>

    <form method="POST" action="{{ url_for('update_employee', employee_id=employee.id) }}">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" name="name" id="name" class="form-control" value="{{ employee.name }}" required>
        </div>
        
        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" name="age" id="age" class="form-control" value="{{ employee.age }}" required>
        </div>
        
        <div class="form-group">
            <label for="email">Official Email</label>
            <input type="email" name="email" id="email" class="form-control" value="{{ employee.email }}" required>
        </div>

        <div class="form-group">
            <label for="phone">Contact Number</label>
            <input type="text" name="phone" id="phone" class="form-control" value="{{ employee.phone }}" required>
        </div>

        <div class="form-group">
            <label for="designation">Designation / Title</label>
            <input type="text" name="designation" id="designation" class="form-control" value="{{ employee.designation }}" required>
        </div>

        <div class="form-group">
            <label for="department_id">Department assignment</label>
            <select name="department_id" id="department_id" class="form-control" required>
                {% for dept in departments %}
                <option value="{{ dept.id }}" {% if dept.id == employee.department_id %}selected{% endif %}>{{ dept.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button type="submit" class="btn btn-secondary"><i class="fa-solid fa-save"></i> Save Changes</button>
            <a href="{{ url_for('employees') }}" class="btn btn-primary" style="color: var(--text-color); border-color: var(--border-color);">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

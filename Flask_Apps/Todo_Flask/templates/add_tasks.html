<!DOCTYPE html>
<html>

<head>

    <title>Add Task</title>

    <style>

        body {

            font-family: Arial;

            background: #f4f4f4;

            padding: 20px;
        }

        .container {

            background: white;

            width: 500px;

            margin: auto;

            padding: 20px;

            border-radius: 10px;
        }

        h1 {

            text-align: center;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-top: 15px;
        }

        button {

            margin-top: 15px;

            padding: 10px 15px;

            background: royalblue;

            color: white;

            border: none;

            cursor: pointer;
        }

        a {

            display: inline-block;

            margin-top: 20px;

            text-decoration: none;

            color: blue;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>➕ Add New Task</h1>

    <form method="POST">

        <input

            type="text"

            name="task"

            placeholder="Enter task"

            required

        >

        <button type="submit">

            Add Task

        </button>

    </form>

    <a href="/">

        ⬅ Go Back

    </a>

</div>

</body>

</html>

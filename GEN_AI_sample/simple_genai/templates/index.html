<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-color: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --bot-msg-bg: rgba(59, 130, 246, 0.1);
            --user-msg-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo i {
            color: var(--primary-color);
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }

        .api-key-container {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .api-key-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            width: 300px;
        }

        .api-key-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding: 2rem;
            position: relative;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding-right: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .chat-history::-webkit-scrollbar {
            width: 6px;
        }

        .chat-history::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .chat-history::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 10px;
        }

        .message {
            display: flex;
            gap: 1rem;
            max-width: 85%;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
        }

        .message.bot .avatar {
            color: var(--primary-color);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .message-content {
            padding: 1rem 1.5rem;
            border-radius: 16px;
            line-height: 1.6;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            overflow-wrap: break-word;
        }

        .message.bot .message-content {
            background: var(--bot-msg-bg);
            border-top-left-radius: 4px;
        }

        .message.user .message-content {
            background: var(--user-msg-bg);
            border-top-right-radius: 4px;
        }
        
        .message-content p {
            margin-bottom: 0.5rem;
        }
        
        .message-content p:last-child {
            margin-bottom: 0;
        }

        .typing-indicator {
            display: none;
            gap: 5px;
            padding: 1.2rem 1.5rem;
            background: var(--bot-msg-bg);
            border-radius: 16px;
            border-top-left-radius: 4px;
            border: 1px solid var(--glass-border);
            width: max-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            margin-top: 1.5rem;
            position: relative;
        }

        .chat-input {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.2rem 4rem 1.2rem 1.5rem;
            color: var(--text-color);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            resize: none;
            height: 60px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
        }

        .send-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            background: #2563eb;
            box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-50%) scale(1.05);
        }
        
        .send-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .markdown-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            color: var(--text-color);
        }
        .markdown-table th, .markdown-table td {
            border: 1px solid var(--glass-border);
            padding: 0.75rem;
            text-align: left;
        }
        .markdown-table th {
            background-color: rgba(255, 255, 255, 0.1);
        }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-robot"></i>
            HR Gen AI
        </div>
        <div class="api-key-container">
            <i class="fa-solid fa-key" style="color: var(--text-muted);"></i>
            <input type="password" id="apiKey" class="api-key-input" placeholder="Enter Gemini API Key..." value="">
        </div>
    </header>

    <div class="chat-container">
        <div class="chat-history" id="chatHistory">
            <div class="message bot">
                <div class="avatar"><i class="fa-solid fa-bolt"></i></div>
                <div class="message-content">
                    <p>Hello! I am connected to your MySQL Employee Database. How can I help you today? You can ask me about employee attendance, salaries, departments, or details about specific employees.</p>
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" class="chat-input" placeholder="Ask about employees..." autocomplete="off">
            <button id="sendBtn" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const chatHistory = document.getElementById('chatHistory');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const typingIndicator = document.getElementById('typingIndicator');

        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }

        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value);
        });

        function addMessage(content, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerHTML = sender === 'bot' ? '<i class="fa-solid fa-bolt"></i>' : '<i class="fa-solid fa-user"></i>';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if(sender === 'bot') {
                contentDiv.innerHTML = marked.parse(content);
                const tables = contentDiv.querySelectorAll('table');
                tables.forEach(table => table.className = 'markdown-table');
            } else {
                contentDiv.textContent = content;
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            
            if (!message) return;
            
            if (!apiKey) {
                alert('Please enter your Gemini API Key in the top right corner.');
                apiKeyInput.focus();
                return;
            }

            addMessage(message, 'user');
            userInput.value = '';
            
            typingIndicator.style.display = 'flex';
            sendBtn.disabled = true;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        api_key: apiKey
                    })
                });

                const data = await response.json();
                
                typingIndicator.style.display = 'none';
                sendBtn.disabled = false;

                if (response.ok) {
                    addMessage(data.response, 'bot');
                } else {
                    addMessage(`Error: ${data.error}`, 'bot');
                }
            } catch (error) {
                typingIndicator.style.display = 'none';
                sendBtn.disabled = false;
                addMessage('A network error occurred. Please try again.', 'bot');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
